<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Cute Wife Kashish ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle, #ffafbd, #ffc3a0); 
            height: 100vh; display: flex; justify-content: center; 
            align-items: center; overflow: hidden; font-family: 'Poppins', sans-serif;
        }

        /* 3D Gallery Container */
        .container {
            width: 150px; height: 200px;
            position: relative; perspective: 1000px;
            display: none; /* Pehle hide rahega */
        }

        .gallery {
            width: 100%; height: 100%;
            position: absolute; transform-style: preserve-3d;
            animation: rotate 20s linear infinite;
        }

        .gallery span {
            position: absolute; width: 100%; height: 100%;
            transform-origin: center; transform-style: preserve-3d;
            -webkit-box-reflect: below 5px linear-gradient(transparent, transparent, rgba(0,0,0,0.2));
        }

        .gallery span img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 10px; border: 2px solid #fff;
        }

        @keyframes rotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Intro Card Style */
        .card {
            background: white; padding: 30px; border-radius: 20px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 320px; z-index: 10;
        }

        h1 { color: #d63384; margin-bottom: 10px; font-size: 22px; }
        button {
            background: #ff4d6d; color: white; border: none;
            padding: 12px 25px; border-radius: 25px; cursor: pointer;
            font-weight: bold; margin-top: 15px; width: 100%;
        }

        /* Floating Hearts Animation */
        .heart { position: absolute; color: #ff4d6d; animation: float 4s linear infinite; }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bgm" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div class="card" id="introCard">
        <img src="https://media.tenor.com/6S30y8VfR_QAAAAi/love-is-in-the-air-joypixel.gif" style="width: 100px;">
        <h1>Sorry Kashish Ji! 🥺</h1>
        <p>Aapke liye ek surprise hai, <b>Rahul</b> ki taraf se. Maan jao na meri <b>Cute Wife</b>!</p>
        <button onclick="showGallery()">Open Surprise 🎁</button>
    </div>

    <div class="container" id="galleryContainer">
        <div class="gallery">
            <span style="--i:1;"><img src="Photo1.jpg"></span>
            <span style="--i:2;"><img src="Photo2.jpg"></span>
            <span style="--i:3;"><img src="Photo3.jpg"></span>
            <span style="--i:4;"><img src="Photo4.jpg"></span>
            <span style="--i:5;"><img src="Photo5.jpg"></span>
        </div>
        <h2 style="position: absolute; bottom: -100px; width: 300px; left: -75px; text-align: center; color: #d63384;">I Love You Forever! ❤️</h2>
    </div>

    <script>
        function showGallery() {
            document.getElementById('bgm').play();
            document.getElementById('introCard').style.display = 'none';
            document.getElementById('galleryContainer').style.display = 'block';
            
            // Set 3D Angles
            const spans = document.querySelectorAll('.gallery span');
            spans.forEach((span, index) => {
                span.style.transform = `rotateY(${(index + 1) * 72}deg) translateZ(250px)`;
            });
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.duration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
