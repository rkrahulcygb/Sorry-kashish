<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Cute Wife Kashish ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle, #ffafbd, #ffc3a0); 
            height: 100vh; display: flex; justify-content: center; 
            align-items: center; overflow: hidden; font-family: 'Arial', sans-serif;
        }

        /* Intro Card */
        #introCard {
            background: white; padding: 30px; border-radius: 20px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 320px; z-index: 100; position: absolute;
        }

        /* 3D Gallery Style */
        .container {
            width: 150px; height: 200px;
            position: relative; perspective: 1000px;
            display: none; 
        }

        .gallery {
            width: 100%; height: 100%;
            position: absolute; transform-style: preserve-3d;
            animation: rotate 18s linear infinite;
        }

        .gallery span {
            position: absolute; width: 100%; height: 100%;
            transform-origin: center; transform-style: preserve-3d;
        }

        .gallery span img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 12px; border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @keyframes rotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        h1 { color: #d63384; font-size: 22px; margin-bottom: 15px; }
        button {
            background: #ff4d6d; color: white; border: none;
            padding: 12px 25px; border-radius: 25px; cursor: pointer;
            font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }

        .heart { position: absolute; color: #ff4d6d; animation: float 4s linear infinite; pointer-events: none; }
        @keyframes float {
            0% { transform: translateY(110vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bgm" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div class="card" id="introCard">
        <img src="https://media.tenor.com/6S30y8VfR_QAAAAi/love-is-in-the-air-joypixel.gif" style="width: 100px; margin-bottom: 10px;">
        <h1>Sorry Kashish Ji! 🥺</h1>
        <p style="color: #555; margin-bottom: 15px;">Maan jao na meri <b>Cute Wife</b>. Aapka <b>Rahul</b> aapse bohot pyaar karta hai.</p>
        <button onclick="startMagic()">See Surprise 🎁</button>
    </div>

    <div class="container" id="galleryContainer">
        <div class="gallery">
            <span style="transform: rotateY(72deg) translateZ(250px);"><img src="Photo1.jpg"></span>
            <span style="transform: rotateY(144deg) translateZ(250px);"><img src="Photo2.jpg"></span>
            <span style="transform: rotateY(216deg) translateZ(250px);"><img src="Photo3.jpg"></span>
            <span style="transform: rotateY(288deg) translateZ(250px);"><img src="Photo4.jpg"></span>
            <span style="transform: rotateY(360deg) translateZ(250px);"><img src="Photo5.jpg"></span>
        </div>
        <div style="position: absolute; bottom: -120px; width: 300px; left: -75px; text-align: center;">
            <h2 style="color: #d63384; text-shadow: 0 2px 5px rgba(0,0,0,0.1);">I Love You Forever! ❤️</h2>
        </div>
    </div>

    <script>
        function startMagic() {
            document.getElementById('bgm').play().catch(e => console.log("Audio play failed"));
            document.getElementById('introCard').style.display = 'none';
            document.getElementById('galleryContainer').style.display = 'block';
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
