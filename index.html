<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Kashish ❤️</title>
<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#ffe6e6,#ffffff);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  text-align:center;
}
.box{
  background:#fff;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  max-width:420px;
}
h1{margin-bottom:10px;}
p{font-size:18px;line-height:1.6;}
.emoji{font-size:30px;margin:10px 0;}
button{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#e53935;
  color:#fff;
  font-size:16px;
}
</style>
</head>
<body>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="box">
  <h1>Sorry Kashish ❤️</h1>
  <p>Main <b>Rahul</b> hoon… dil se maafi maang raha hoon.</p>
  <p>Meri galtiyon se tumhe dard hua 😔</p>
  <p>Tum meri duniya ho, tumhare bina sab adhoora lagta hai 🥺</p>
  <div class="emoji">😔💔🙏</div>
  <p>Bas ek chance aur de do 💞</p>
  <button onclick="document.getElementById('bgm').play()">Tap to Play Music 🎵</button>
</div>

</body>
</html>
